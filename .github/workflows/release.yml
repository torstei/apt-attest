name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # The only job that can mint an attestation, so the release environment makes it wait
  # for approval: an attestation that passes apt-attest exists once this job runs.
  build:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the packages
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          scripts/build-deb.sh "${GITHUB_REF_NAME#v}" amd64 arm64
      - name: Check that a second build in another directory is identical
        run: |
          git worktree add --detach "$RUNNER_TEMP/again" HEAD
          cd "$RUNNER_TEMP/again"
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          scripts/build-deb.sh "${GITHUB_REF_NAME#v}" amd64 arm64
          for deb in dist/*.deb; do cmp "$deb" "$GITHUB_WORKSPACE/$deb"; done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: dist/*.deb
      # one bundle names every package as a subject; apt-attest looks for it under each
      # package's name
      - name: Keep the provenance bundle beside each package
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          for deb in dist/*.deb; do cp "$BUNDLE" "$deb.sigstore.json"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: dist/
          if-no-files-found: error

  # Holds the repository signing key. Runs only after the approved build, from a v* tag,
  # which only admins can create.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apt-repo
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.sigstore.json --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes
      - name: Collect every released package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir debs
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | while read -r tag; do
            gh release download "$tag" --pattern '*.deb' --pattern '*.deb.sigstore.json' --dir debs --clobber
          done
      - name: Install apt-ftparchive
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils
      - name: Build and sign the repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          fingerprint=$(gpg --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          scripts/build-apt-repo.sh debs site "$fingerprint"
          rm -rf "$GNUPGHOME"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
