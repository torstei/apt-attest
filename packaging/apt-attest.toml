# Requires apt-attest, and everything from apt-attest's apt repository, to be built by
# apt-attest's release workflow from a v* tag on a GitHub-hosted runner.
[match]
packages = ["apt-attest"]
origins  = ["https://torstei.github.io/apt-attest"]

[identity]
issuer         = "https://token.actions.githubusercontent.com"
repository     = "torstei/apt-attest"
repository_id  = 1465853268
owner_id       = 1751971
workflow       = ".github/workflows/release.yml"
refs           = ["refs/tags/v*"]
runner         = "github-hosted"
predicate_type = "https://slsa.dev/provenance/v1"
